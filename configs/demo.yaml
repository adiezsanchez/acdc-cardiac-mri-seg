# Shared defaults. Phase YAML files override epochs/base/batch_size.
# `pixi run demo` trains each phase with its own config unless --epochs is set.

data_root: data/synthetic
size: 128
depth: 10
context: 1          # phase 2: ±1 neighbouring slice → 3 input channels
batch_size: 8
epochs: 8
lr: 0.001
base: 16
